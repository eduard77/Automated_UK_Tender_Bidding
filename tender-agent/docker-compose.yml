services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tender_agent
    ports:
      - "5432:5432"
    volumes:
      - tender_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://tender:tender@db:5432/tender_agent
      # Single, writable, host-mounted documents location (issue 4d-2). Must
      # match the /app/data/documents volume mount below so fetched files persist
      # on the host where the user can see them.
      DOCUMENT_STORAGE_DIR: /app/data/documents
      # Browser bridge (native Windows helper running OUTSIDE Docker). The
      # container reaches the host at host.docker.internal; extra_hosts makes
      # that work on Linux engines too. TENDER_AGENT_BRIDGE_TOKEN MUST match
      # browser-bridge/.env — without it the backend can't drive the bridge
      # (issue 4d-3). Both come from .env (loaded below) but are passed
      # explicitly so they're also overridable from the host shell.
      TENDER_AGENT_BRIDGE_URL: ${TENDER_AGENT_BRIDGE_URL:-http://host.docker.internal:8765}
      TENDER_AGENT_BRIDGE_TOKEN: ${TENDER_AGENT_BRIDGE_TOKEN}
    env_file: .env
    # host.docker.internal lets the container reach a service on the host
    # (the browser bridge). host-gateway is required on Linux engines.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Documents folder: the backend writes fetched ITT files here; the host
      # path persists them so the user can open them. Mounted writable, so the
      # app user can create the sha-sharded layout under it (issue 4d-2).
      - "${USERPROFILE:-${HOME}}/.tender-agent/documents:/app/data/documents"
      # Shared download folder: the bridge (on Windows) writes fetched files
      # here; the backend reads them back. The host path defaults to the user's
      # profile; on Windows Docker Desktop passes USERPROFILE through. If the
      # interpolation is awkward on your machine, replace the left side with an
      # absolute host path, e.g.
      #   - "C:/Users/you/.tender-agent/bridge-downloads:/app/data/bridge-downloads"
      - "${USERPROFILE:-${HOME}}/.tender-agent/bridge-downloads:/app/data/bridge-downloads"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn tender_agent.main:app --host 0.0.0.0 --port 8000"
volumes:
  tender_db: