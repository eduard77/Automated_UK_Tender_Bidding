services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tender_agent
    ports:
      - "5432:5432"
    volumes:
      - tender_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://tender:tender@db:5432/tender_agent
    env_file: .env
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn tender_agent.main:app --host 0.0.0.0 --port 8000"
volumes:
  tender_db: