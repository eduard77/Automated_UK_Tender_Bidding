[project]
name = "tender-agent"
version = "0.1.0"
description = "UK public tender discovery and bid automation agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "apscheduler>=3.10.4",
    "python-dateutil>=2.9.0",
    "rapidfuzz>=3.10.0",
    "structlog>=24.4.0",
    "anthropic>=0.39.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "pywebpush>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
"src/tender_agent/api/*" = ["B008"]  # FastAPI Depends/Query in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
