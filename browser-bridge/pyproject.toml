[project]
name = "tender-agent-browser-bridge"
version = "0.1.0"
description = "Native Windows browser bridge for Tender Agent — drives a real, visible Chrome the user logs into."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Hard-pinned to match the Playwright base image (v1.47.0-noble) in the
    # Dockerfile EXACTLY — a floor (>=) lets pip pull a newer Playwright whose
    # bundled Chromium revision isn't in the image, which 500s on launch.
    "playwright==1.47.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires a real browser + network (skipped in CI)",
]
