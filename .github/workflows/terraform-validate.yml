name: Terraform validate

# fmt + init + validate on every PR that touches terraform/. Run as one step
# per directory so a failure surfaces with its directory in the job summary —
# the previous single-loop step hid which directory failed (set -e exited
# before the per-iteration summary printed).

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: terraform fmt + validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false

      - name: terraform fmt -check -recursive
        working-directory: terraform
        run: terraform fmt -check -recursive

      # --- one step per directory below ------------------------------------
      # Each runs `terraform init -backend=false && terraform validate` so:
      #  - A failure is attributed to its directory in the GHA UI without
      #    digging through a combined log.
      #  - `set -e` (implicit in `run:`) halts on first failure of THAT step,
      #    not the whole loop, so subsequent steps still report on the rest.

      - name: bootstrap
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: modules/vpc
        working-directory: terraform/modules/vpc
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: modules/rds
        working-directory: terraform/modules/rds
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: modules/s3
        working-directory: terraform/modules/s3
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: modules/secrets
        working-directory: terraform/modules/secrets
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: modules/alb
        working-directory: terraform/modules/alb
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: modules/ecs_service
        working-directory: terraform/modules/ecs_service
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: modules/cloudfront
        working-directory: terraform/modules/cloudfront
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: envs/staging
        working-directory: terraform/envs/staging
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: envs/prod
        working-directory: terraform/envs/prod
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
